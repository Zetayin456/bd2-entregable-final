[http]
bind_address = 0.0.0.0
port = 5984

[couchdb]
single_node = true
os_process_timeout = 60000

[chttpd]
authentication_handlers = {chttpd_auth, proxy_authentication_handler}, {chttpd_auth, cookie_authentication_handler}, {chttpd_auth, default_authentication_handler}

[chttpd_auth]
x_auth_username = X-Auth-CouchDB-UserName
x_auth_roles = X-Auth-CouchDB-Roles
x_auth_token = X-Auth-CouchDB-Token
; Erlang names SHA-1 `sha`; the backend signs the username with HMAC-SHA1.
hash_algorithms = sha
proxy_use_secret = true
