name: reciclaje-lab

x-limites: &limites
  cpus: "2.0"
  mem_limit: 2g

services:
  couchdb:
    image: couchdb:3.3
    env_file: .env
    entrypoint: ["/bin/sh", "-c", "export HOME=/opt/couchdb; exec setpriv --reuid=couchdb --regid=couchdb --clear-groups /opt/couchdb/bin/couchdb"]
    <<: *limites
    environment:
      COUCHDB_USER: ${COUCHDB_USER:?Define COUCHDB_USER en .env}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?Define COUCHDB_PASSWORD en .env}
    volumes:
      - couchdb_data:/opt/couchdb/data
      - ./couchdb/lab.ini:/opt/couchdb/etc/local.d/10-security.ini:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5984/_up"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend_net]

  couchdb-init:
    image: curlimages/curl:8.8.0
    depends_on:
      couchdb: { condition: service_healthy }
    volumes: ["./couchdb/init.sh:/init.sh:ro"]
    entrypoint: ["/bin/sh", "/init.sh"]
    env_file: .env
    environment:
      COUCHDB_URL: http://couchdb:5984
    networks: [backend_net]

  api:
    build: ./backend
    <<: *limites
    environment:
      COUCHDB_URL: http://couchdb:5984
      COUCHDB_USER: ${COUCHDB_USER:?Define COUCHDB_USER en .env}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?Define COUCHDB_PASSWORD en .env}
      COUCHDB_PROXY_SECRET: ${COUCHDB_PROXY_SECRET:?Define COUCHDB_PROXY_SECRET en .env}
      COUCHDB_DB: reciclaje
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      RUST_LOG: info
    depends_on:
      couchdb-init: { condition: service_completed_successfully }
    ports: ["8091:8080"]
    networks: [backend_net, edge_net]

  web:
    build: ./frontend
    environment:
      VITE_API_URL: http://api:8080
    ports: ["5173:5173"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks: [edge_net]

  client-sim:
    build: ./client-sim
    environment:
      API_URL: http://api:8080
      SIM_CLIENTS: 100
    depends_on: [api]
    networks: [edge_net]

  netem-api:
    image: nicolaka/netshoot
    network_mode: "service:api"
    cap_add: [NET_ADMIN]
    environment:
      NETEM_PROFILE: 
    volumes: ["./netem:/scripts:ro"]
    entrypoint: ["/bin/sh", "/scripts/apply_profile.sh"]
    restart: "no"

  netem-client:
    image: nicolaka/netshoot
    network_mode: "service:client-sim"
    cap_add: [NET_ADMIN]
    environment:
      NETEM_PROFILE: 
    volumes: ["./netem:/scripts:ro"]
    entrypoint: ["/bin/sh", "/scripts/apply_profile.sh"]
    restart: "no"

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes: ["./telemetry/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    networks: [backend_net, edge_net]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [backend_net]

  k6:
    image: grafana/k6:0.52.0
    profiles: ["load"]
    cpuset: "6-7"
    environment:
      TARGET: http://api:8080
      VUS: 
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
    volumes: ["./load:/scripts:ro"]
    command: ["run", "-o", "experimental-prometheus-rw", "/scripts/reciclaje.js"]
    depends_on: [api]
    networks: [edge_net]

  postgres:
    image: postgres:16
    profiles: ["baseline"]
    <<: *limites
    environment:
      POSTGRES_PASSWORD: 
      POSTGRES_DB: reciclaje
    volumes: ["pg_data:/var/lib/postgresql/data"]
    networks: [backend_net]

  baseline-api:
    build: ./baseline
    profiles: ["baseline"]
    <<: *limites
    environment:
      DATABASE_URL: postgres://postgres:@postgres:5432/reciclaje
    depends_on: [postgres]
    ports: ["8081:8081"]
    networks: [backend_net, edge_net]

networks:
  backend_net: {}
  edge_net: {}

volumes:
  couchdb_data: {}
  pg_data: {}
