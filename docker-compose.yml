name: reciclaje-lab

x-limites: &limites
  cpus: "2.0"
  mem_limit: 2g

services:
  couchdb:
    image: couchdb:3.3
    entrypoint:
      - /bin/sh
      - -c
      - |
        COUCHDB_USER_CLEAN=$$(printf '%s' "$$COUCHDB_USER" | tr -d '\015')
        COUCHDB_PASSWORD_CLEAN=$$(printf '%s' "$$COUCHDB_PASSWORD" | tr -d '\015')
        COUCHDB_PROXY_SECRET_CLEAN=$$(printf '%s' "$$COUCHDB_PROXY_SECRET" | tr -d '\015')
        test -n "$$COUCHDB_USER_CLEAN" && test -n "$$COUCHDB_PASSWORD_CLEAN" && test -n "$$COUCHDB_PROXY_SECRET_CLEAN"
        printf '[admins]\n%s = %s\n' "$$COUCHDB_USER_CLEAN" "$$COUCHDB_PASSWORD_CLEAN" > /opt/couchdb/etc/local.d/00-admin.ini
        printf '[chttpd_auth]\nsecret = %s\n' "$$COUCHDB_PROXY_SECRET_CLEAN" > /opt/couchdb/etc/local.d/05-proxy-secret.ini
        chown couchdb:couchdb /opt/couchdb/etc/local.d/00-admin.ini /opt/couchdb/etc/local.d/05-proxy-secret.ini
        export HOME=/opt/couchdb
        exec setpriv --reuid=couchdb --regid=couchdb --clear-groups /opt/couchdb/bin/couchdb
    <<: *limites
    environment:
      COUCHDB_USER: ${COUCHDB_USER:?Define COUCHDB_USER en .env}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?Define COUCHDB_PASSWORD en .env}
      COUCHDB_PROXY_SECRET: ${COUCHDB_PROXY_SECRET:?Define COUCHDB_PROXY_SECRET en .env}
    volumes:
      - couchdb_data:/opt/couchdb/data
      - ./couchdb/lab.ini:/opt/couchdb/etc/local.d/10-security.ini:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5984/_up"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend_net]

  couchdb-init:
    image: curlimages/curl:8.8.0
    depends_on:
      couchdb: { condition: service_healthy }
    volumes: ["./couchdb/init.sh:/init.sh:ro"]
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      COUCHDB_URL: http://couchdb:5984
      COUCHDB_USER: ${COUCHDB_USER:?Define COUCHDB_USER en .env}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?Define COUCHDB_PASSWORD en .env}
      BOOTSTRAP_ADMIN_USER: ${BOOTSTRAP_ADMIN_USER:?Define BOOTSTRAP_ADMIN_USER en .env}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Define BOOTSTRAP_ADMIN_PASSWORD en .env}
    networks: [backend_net]

  api:
    build: ./backend
    <<: *limites
    environment:
      COUCHDB_URL: http://couchdb:5984
      COUCHDB_USER: ${COUCHDB_USER:?Define COUCHDB_USER en .env}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?Define COUCHDB_PASSWORD en .env}
      COUCHDB_PROXY_SECRET: ${COUCHDB_PROXY_SECRET:?Define COUCHDB_PROXY_SECRET en .env}
      COUCHDB_DB: reciclaje
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      RUST_LOG: info
    depends_on:
      couchdb-init: { condition: service_completed_successfully }
    ports: ["8091:8080"]
    networks: [backend_net, edge_net]

  web:
    build: ./frontend
    environment:
      VITE_API_URL: /
      VITE_PROXY_TARGET: http://api:8080
    ports: ["5173:5173"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks: [edge_net]

  client-sim:
    build: ./client-sim
    environment:
      API_URL: http://api:8080
      SIM_CLIENTS: 100
      SIM_ADMIN_USER: ${BOOTSTRAP_ADMIN_USER:?Define BOOTSTRAP_ADMIN_USER en .env}
      SIM_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Define BOOTSTRAP_ADMIN_PASSWORD en .env}
    depends_on: [api]
    networks: [edge_net]

  netem-api:
    image: nicolaka/netshoot
    network_mode: "service:api"
    cap_add: [NET_ADMIN]
    environment:
      NETEM_PROFILE: 
      NETEM_INTERFACE: ${NETEM_API_INTERFACE:-eth1}
    volumes: ["./netem:/scripts:ro"]
    entrypoint: ["/bin/sh", "/scripts/apply_profile.sh"]
    restart: "no"

  netem-client:
    image: nicolaka/netshoot
    network_mode: "service:client-sim"
    cap_add: [NET_ADMIN]
    environment:
      NETEM_PROFILE: 
      NETEM_INTERFACE: ${NETEM_CLIENT_INTERFACE:-eth0}
    volumes: ["./netem:/scripts:ro"]
    entrypoint: ["/bin/sh", "/scripts/apply_profile.sh"]
    restart: "no"

  prometheus:
    image: prom/prometheus:v2.53.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-remote-write-receiver", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./telemetry/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports: ["9090:9090"]
    networks: [backend_net, edge_net]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [backend_net]

  k6:
    image: grafana/k6:0.52.0
    profiles: ["load"]
    cpuset: "6-7"
    environment:
      TARGET: http://api:8080
      VUS: ${VUS:-10}
      DURATION: ${DURATION:-2m}
      RUN_ID: ${RUN_ID:-manual}
      NETEM_PROFILE: ${NETEM_PROFILE:-ideal}
      K6_ADMIN_USER: ${BOOTSTRAP_ADMIN_USER:?Define BOOTSTRAP_ADMIN_USER en .env}
      K6_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Define BOOTSTRAP_ADMIN_PASSWORD en .env}
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
    volumes: ["./load:/scripts:ro", "./results:/results"]
    command: ["run", "--summary-export", "/results/${RUN_ID:-manual}-k6.json", "-o", "experimental-prometheus-rw", "/scripts/reciclaje.js"]
    depends_on: [api, client-sim]
    network_mode: "service:client-sim"

  postgres:
    image: postgres:16
    profiles: ["baseline"]
    <<: *limites
    environment:
      POSTGRES_USER: baseline
      POSTGRES_PASSWORD: ${BASELINE_POSTGRES_PASSWORD:-baseline-local}
      POSTGRES_DB: reciclaje
    volumes: ["pg_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baseline -d reciclaje"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend_net]

  baseline-bench:
    image: postgres:16
    profiles: ["baseline-bench"]
    <<: *limites
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: baseline
      PGPASSWORD: ${BASELINE_POSTGRES_PASSWORD:-baseline-local}
      PGDATABASE: reciclaje
      BASELINE_CLIENTS: ${BASELINE_CLIENTS:-10}
      BASELINE_JOBS: ${BASELINE_JOBS:-2}
      BASELINE_DURATION: ${BASELINE_DURATION:-60}
      BASELINE_SEED: ${BASELINE_SEED:-15015}
      RUN_ID: ${RUN_ID:-baseline-manual}
    volumes:
      - ./baseline:/baseline:ro
      - ./results:/results
    entrypoint: ["/bin/sh", "/baseline/run.sh"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend_net]

networks:
  backend_net: {}
  edge_net: {}

volumes:
  couchdb_data: {}
  pg_data: {}
  prometheus_data: {}
